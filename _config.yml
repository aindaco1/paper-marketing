title: Paper
description: A free, open-source paper-texture overlay for your Mac. Free forever, built with Deckle.
url: "https://paper-app.xyz"
baseurl: ""
repository: aindaco1/paper-marketing
theme: just-the-docs
permalink: pretty
lang: en
color_scheme: paper
logo: /assets/images/paper-icon.png
image: /assets/images/paper-social.png
search_enabled: true
search:
  heading_level: 3
  previews: 3
  preview_words_before: 5
  preview_words_after: 10
  tokenizer_separator: /[\s/]+/
plugins:
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-include-cache
sass:
  style: compressed
kramdown:
  input: GFM
defaults:
  - scope:
      path: ""
    values:
      layout: default
      lang: en
      image: /assets/images/paper-social.png
  - scope:
      path: es
    values:
      lang: es
exclude:
  - .sass-cache/
  - .jekyll-cache/
  - .translation-cache/
  - .artifacts/
  - Gemfile
  - Gemfile.lock
  - scripts/
  - README.md
  - AGENTS.md
  - LICENSE
  - docs/maintenance/
  - assets/css/home.scss
  - vendor/
