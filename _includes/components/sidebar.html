{% assign locale = site.data.i18n[page.lang] %}{% assign docs_prefix = '' %}{% if page.lang == 'es' %}{% assign docs_prefix = '/es' %}{% endif %}
<header class="side-bar"><div class="site-header"><a class="docs-wordmark" href="{{ docs_prefix | append: '/docs/' | relative_url }}">Paper / docs</a><button id="menu-button" class="site-button btn-reset" aria-label="{{ locale.nav.menu }}" aria-expanded="false"><svg viewBox="0 0 24 24" class="icon" aria-hidden="true"><use xlink:href="#svg-menu"></use></svg></button></div>
<nav aria-label="{{ locale.nav.docs }}" id="site-nav" class="site-nav">{% assign localized_pages = site.html_pages | where: 'lang', page.lang %}{% include components/nav/pages.html pages=localized_pages %}</nav></header>
